<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form>

    <label>Father's Name</label>
    <input type="text">
    <label for="myname">Name</label>
    <input type="text" id="myname" name="username">

    <input type="text"> <!-- normal words -->
    <label>password<input type="password"> </label><!-- dots hide what you type -->
    <input type="number"> <!-- only numbers, with up/down arrows -->
    <label>date<input type="date"> </label><!-- a calendar picker -->
    <input type="email"> <!-- for email addresses -->

    <!-- select only one option-->
    <p>Do you like pizza?</p>
    <label><input type="radio" name="pizza" value="yes"> Yes</label>
    <label><input type="radio" name="pizza" value="no"> No</label>
    <!-- select multiple options-->
    <p>Which do you know?</p>
    <label><input type="checkbox" name="skills" value="html"> HTML</label>
    <label><input type="checkbox" name="skills" value="css"> CSS</label>
    <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
    <br>
    <!-- select from drop down option-->
    <label for="fruit">Favourite fruit</label>
    <select id="fruit" name="fruit">
      <option value="mango">Mango</option>
      <option value="apple">Apple</option>
      <option value="banana">Banana</option>
    </select>

    <!-- for long text input -->
    <label for="msg">Your message</label>
    <textarea id="msg" name="message" rows="4"></textarea>

    <!-- making a question compulsory-->
    <label><input type="text" id="myname" name="username" required> name</label>
    <button type="submit">Send</button>
  </form>
</body>

</html>
