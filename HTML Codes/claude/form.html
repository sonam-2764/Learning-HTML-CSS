<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <form>

    <div>
      <label for="father-name">Father's Name: </label>
      <input type="text" id="father-name">
    </div>

    <div>
      <label for="myname">Name: </label>
      <input type="text" id="myname" name="username">
    </div>

    <!-- normal words -->
    <div>
      <label for="words">Words: </label>
      <input type="text" id="words">
    </div>

    <!-- dots hide what you type -->
    <div>
      <label for="password">Password: </label>
      <input type="password" id="password">
    </div>

    <!-- only numbers, with up/down arrows -->
    <div>
      <label for="number">Number: </label>
      <input type="number" id="number">
    </div>

    <!-- a calendar picker -->
    <div>
      <label for="date">Date: </label>
      <input type="date" id="date">
    </div>

    <!-- for email addresses -->
    <div>
      <label for="email">Email: </label>
      <input type="email" id="email">
    </div>

    <!-- select only one option-->
    <div>
      <p>Do you like pizza?</p>
      <label><input type="radio" name="pizza" value="yes"> Yes</label>
      <label><input type="radio" name="pizza" value="no"> No</label>
    </div>

    <!-- select multiple options-->
    <div>
      <p>Which do you know?</p>
      <label><input type="checkbox" name="skills" value="html"> HTML</label>
      <label><input type="checkbox" name="skills" value="css"> CSS</label>
      <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
    </div>

    <!-- select from drop down option-->
    <div>
      <label for="fruit">Favourite fruit: </label>
      <select id="fruit" name="fruit">
        <option value="mango">Mango</option>
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
      </select>
    </div>

    <!-- for long text input -->
    <div>
      <label for="msg">Your message: </label>
      <textarea id="msg" name="message" rows="4"></textarea>
    </div>

    <!-- making a question compulsory-->
    <div>
      <label for="compulsory-name">Name (Required): </label>
      <input type="text" id="compulsory-name" name="username_required" required>
    </div>

    <div>
      <button type="submit">Send</button>
    </div>
  </form>
</body>

</html>
