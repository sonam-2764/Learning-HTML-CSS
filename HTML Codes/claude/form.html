<html lang="en">

    <meta charset="UTF-8">

<body>
   <form>
    
    <label>Father's Name</label>
  <input type="text">
  <label for="myname">Name</label>
<input type="text" id="myname" name="username">

<!-- select only one option-->
<p>Do you like pizza?</p>
<label><input type="radio" name="pizza" value="yes"> Yes</label>
<label><input type="radio" name="pizza" value="no"> No</label>
<!-- select multiple options-->
<p>Which do you know?</p>
<label><input type="checkbox" name="skills" value="html"> HTML</label>
<label><input type="checkbox" name="skills" value="css"> CSS</label>
<label><input type="checkbox" name="skills" value="js"> JavaScript</label>


    <input type="text">      <!-- normal words -->
    
    <input type="password">  <!-- dots hide what you type -->
    <input type="number">    <!-- only numbers, with up/down arrows -->
    <input type="date">      <!-- a calendar picker -->
    <input type="email">     <!-- for email addresses -->
    <button type="submit">Send</button>
   </form> 
</body>
